<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wema Super Agent</title>
    <script>
      // GitHub Pages SPA fallback: redirect any unknown path into the app base path.
      (function () {
        var base = '/pos-manager/';
        var path = window.location.pathname;
        if (path === '/' || path === '/index.html') {
          window.location.replace(base);
        } else if (path.indexOf(base) !== 0) {
          window.location.replace(base + path.replace(/^\/+/, ''));
        }
      })();
    </script>
  </head>
  <body></body>
</html>
